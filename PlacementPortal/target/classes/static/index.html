<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .gradient-text {
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen">

<nav class="sticky top-0 z-50 bg-white/70 backdrop-blur-md border-b border-gray-100 p-4">
    <div class="container mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor font-bold"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-gray-900">Career<span class="text-indigo-600">Gate</span></h1>
        </div>
        <div class="flex space-x-4">
            <button onclick="showSection('student')" class="text-sm font-semibold text-gray-600 hover:text-indigo-600 px-4 py-2">Student View</button>
            <button onclick="showSection('admin')" class="bg-indigo-50 text-indigo-700 text-sm font-bold px-5 py-2 rounded-full hover:bg-indigo-100 transition">Admin Panel</button>
        </div>
    </div>
</nav>

<div class="container mx-auto mt-10 p-4">

    <div id="admin-section" class="hidden max-w-2xl mx-auto">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl border border-gray-50">
            <h2 class="text-3xl font-black mb-8 text-gray-800">Post New Job</h2>
            <div class="grid gap-6">
                <input id="comp" placeholder="Company Name" class="w-full bg-gray-50 border-0 p-4 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <input id="role" placeholder="Role" class="bg-gray-50 border-0 p-4 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none">
                    <input id="pkg" placeholder="Package (LPA)" class="bg-gray-50 border-0 p-4 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <textarea id="desc" placeholder="Job Description" class="bg-gray-50 border-0 p-4 rounded-2xl h-32 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                <button onclick="saveJob()" class="bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-xl shadow-indigo-200 hover:bg-indigo-700 transition transform active:scale-95">Publish Job</button>
            </div>
        </div>
    </div>

    <div id="student-section">
        <div class="mb-12 text-center">
            <h2 class="text-5xl font-black text-gray-900 mb-4">Discover Your <span class="gradient-text">Future</span></h2>
            <p class="text-gray-500 font-medium">Browse through premium opportunities from top companies</p>
        </div>
        <div id="jobList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        </div>
    </div>
</div>

<div id="applyModal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
    <div class="bg-white p-8 rounded-[2rem] w-full max-w-md shadow-2xl animate-float">
        <div class="flex justify-between items-center mb-6">
            <h3 id="modalTitle" class="text-2xl font-black text-gray-800">Apply</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold">X</button>
        </div>
        <div class="space-y-4">
            <input id="stuName" placeholder="Full Name" class="w-full bg-gray-50 p-4 rounded-xl border-0 focus:ring-2 focus:ring-indigo-500 outline-none">
            <input id="stuCgpa" placeholder="Current CGPA" class="w-full bg-gray-50 p-4 rounded-xl border-0 focus:ring-2 focus:ring-indigo-500 outline-none">
            <input id="stuSkills" placeholder="Skills (React, Java, etc.)" class="w-full bg-gray-50 p-4 rounded-xl border-0 focus:ring-2 focus:ring-indigo-500 outline-none">
            <button onclick="submitApplication()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-indigo-700 transition">Submit Application</button>
        </div>
    </div>
</div>

<script>
    let selectedCompany = "";

    function showSection(section) {
        document.getElementById('admin-section').classList.toggle('hidden', section !== 'admin');
        document.getElementById('student-section').classList.toggle('hidden', section !== 'student');
        if(section === 'student') loadJobs();
    }

    async function loadJobs() {
        const res = await fetch('/api/jobs');
        const data = await res.json();
        const list = document.getElementById('jobList');
        list.innerHTML = data.map(j => `
                <div class="glass-card p-8 rounded-[2rem] hover:shadow-2xl transition duration-500 group border border-transparent hover:border-indigo-100">
                    <div class="flex justify-between items-start mb-6">
                        <div class="bg-indigo-50 text-indigo-700 px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest">${j.packageAmount}</div>
                    </div>
                    <h3 class="text-2xl font-black text-gray-900 mb-1 group-hover:text-indigo-600 transition">${j.company}</h3>
                    <p class="text-gray-500 font-semibold mb-4">${j.role}</p>
                    <p class="text-gray-400 text-sm mb-6 line-clamp-2">${j.description || 'Join us to build the future.'}</p>
                    <button onclick="applyJob('${j.company}')" class="w-full bg-gray-900 text-white font-bold py-4 rounded-2xl hover:bg-indigo-600 transition shadow-lg">Apply Now</button>
                </div>
            `).reverse().join('');
    }

    async function saveJob() {
        const job = {
            company: document.getElementById('comp').value,
            role: document.getElementById('role').value,
            packageAmount: document.getElementById('pkg').value,
            description: document.getElementById('desc').value
        };
        await fetch('/api/jobs', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(job)
        });
        alert("Job Posted!");
        showSection('student');
    }

    function applyJob(company) {
        selectedCompany = company;
        document.getElementById('modalTitle').innerText = "Apply for " + company;
        document.getElementById('applyModal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('applyModal').classList.add('hidden');
    }

    async function submitApplication() {
        const appData = {
            studentName: document.getElementById('stuName').value,
            cgpa: document.getElementById('stuCgpa').value,
            skills: document.getElementById('stuSkills').value,
            companyName: selectedCompany
        };

        const res = await fetch('/api/jobs/apply', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(appData)
        });

        if(res.ok) {
            alert("🎉 Success! Application sent to " + selectedCompany);
            closeModal();
            document.getElementById('stuName').value = "";
            document.getElementById('stuCgpa').value = "";
            document.getElementById('stuSkills').value = "";
        }
    }

    loadJobs();
</script>
</body>
</html>
